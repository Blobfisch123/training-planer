<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>TrainingPlaner</title>
  <meta name="theme-color" content="#e94560">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Training">
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <!-- Loading Screen -->
  <div id="loading-screen" style="display:flex;">
    <div class="spinner"></div>
    <div style="color:var(--text2);font-size:14px;">Wird geladen…</div>
  </div>

  <!-- Auth Screen -->
  <div id="auth-screen" style="display:none;">
    <div class="auth-card">
      <div class="auth-logo">
        <div class="auth-logo-icon">🏋️</div>
        <div class="auth-logo-title">TrainingPlaner</div>
      </div>
      <div class="form-group">
        <label class="form-label">Nutzername</label>
        <input class="form-control" id="auth-username" type="text" placeholder="Dein Name"
          autocomplete="username" onkeydown="if(event.key==='Enter')authSubmit()">
      </div>
      <div class="auth-error" id="auth-error"></div>
      <button class="btn btn-primary" id="auth-submit-btn" style="width:100%;" onclick="authSubmit()">
        Anmelden
      </button>
      <p style="color:var(--text2);font-size:13px;text-align:center;margin-top:14px;line-height:1.5;">
        Neuer Nutzer? Einfach einen Namen eingeben —<br>das Konto wird automatisch erstellt.
      </p>
    </div>
  </div>

  <!-- App Layout -->
  <div class="app-layout" id="app-layout" style="display:none;">
    <!-- Sidebar -->
    <aside class="sidebar" id="sidebar">
      <div class="sidebar-logo">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
          <path d="M6 4v16M18 4v16M2 9h4M18 9h4M2 15h4M18 15h4M6 12h12"/>
        </svg>
        <span class="sidebar-label">TrainingPlaner</span>
        <button class="sidebar-toggle" onclick="toggleSidebar()" title="Sidebar ein-/ausklappen">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M15 18l-6-6 6-6"/></svg>
        </button>
      </div>
      <nav class="sidebar-nav">
        <a class="nav-item active" data-view="dashboard" onclick="navigate('dashboard')">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/>
            <rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/>
          </svg>
          <span>Dashboard</span>
        </a>
        <a class="nav-item" data-view="plans" onclick="navigate('plans')">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2"/>
            <rect x="9" y="3" width="6" height="4" rx="1"/><path d="M9 12h6M9 16h4"/>
          </svg>
          <span>Trainingsplan</span>
        </a>
        <a class="nav-item" data-view="schedule" onclick="navigate('schedule')">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/>
          </svg>
          <span>Wochenplan</span>
        </a>
        <a class="nav-item" data-view="workout" onclick="navigate('workout')">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <circle cx="12" cy="12" r="10"/><path d="M12 8v4l3 3"/>
          </svg>
          <span>Training starten</span>
        </a>
        <a class="nav-item" data-view="progress" onclick="navigate('progress')">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M3 20l5-8 4 4 5-7 4 5"/><path d="M3 4v16h18"/>
          </svg>
          <span>Fortschritt</span>
        </a>
        <a class="nav-item" data-view="library" onclick="navigate('library')">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M4 19.5A2.5 2.5 0 016.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 014 19.5v-15A2.5 2.5 0 016.5 2z"/>
          </svg>
          <span>Übungsbibliothek</span>
        </a>
        <a class="nav-item" data-view="injuries" onclick="navigate('injuries')">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/>
            <path d="M12 8v4M12 16h.01"/>
          </svg>
          <span>Verletzungen</span>
          <span class="injury-badge" id="injury-badge" style="display:none">!</span>
        </a>
      </nav>
      <div class="sidebar-user">
        <div class="sidebar-user-email" id="sidebar-user-email"></div>
        <button class="btn btn-secondary btn-sm sidebar-logout-btn" onclick="authLogout()">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="width:14px;height:14px;">
            <path d="M9 21H5a2 2 0 01-2-2V5a2 2 0 012-2h4M16 17l5-5-5-5M21 12H9"/>
          </svg>
          <span>Abmelden</span>
        </button>
      </div>
    </aside>

    <!-- Main Content -->
    <main class="main-content">
      <div id="content"></div>
    </main>
  </div>

  <!-- Modal -->
  <div class="modal-overlay" id="modal-overlay" onclick="closeModal(event)">
    <div class="modal" id="modal">
      <button class="modal-close" onclick="closeModal()">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M18 6L6 18M6 6l12 12"/>
        </svg>
      </button>
      <div id="modal-content"></div>
    </div>
  </div>

  <!-- Firebase SDK (compat) -->
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>
  <script src="firebase-config.js"></script>
  <script src="app.js"></script>
  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('./sw.js');
    }
  </script>
</body>
</html>
